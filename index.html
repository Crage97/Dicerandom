<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rolling Dice - Position Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <h1 class="page-title">🎲 LETS CONNECT 🎲</h1>
        <p class="instructions">TOUCH NERVE TO EXPLORE</p>

        <div class="controls-section">
            <div class="main-controls">
                <button class="generate-button" onclick="generatePosition()" id="generateButton">
                    🔥 NERVE 🔥
                </button>

                <div class="secondary-controls">
                    <button class="info-button" onclick="showInfoPage()" id="infoButton">
                        📖 ALL POSITIONS
                    </button>

                    <div class="history-dropdown">
                        <button class="history-button" onclick="toggleHistory()" id="historyButton">
                            📜 HISTORY <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="history-list" id="historyList" style="display: none;">
                            <div class="history-empty">No positions generated yet</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-controls">
                <div class="toggle-container">
                    <span class="toggle-label">🎯 RANDOM MODE</span>
                    <div class="toggle-switch" onclick="toggleRandomMode()" id="toggleSwitch">
                        <div class="toggle-slider" id="toggleSlider"></div>
                    </div>
                    <span class="toggle-status" id="toggleStatus">ON</span>
                </div>

                <div class="difficulty-slider-container" id="difficultySliderContainer" style="display: none;">
                    <div class="slider-label">🌡️ DIFFICULTY LEVEL</div>
                    <div class="difficulty-slider" id="difficultySlider">
                        <div class="slider-track">
                            <div class="slider-thumb" id="sliderThumb"></div>
                        </div>
                        <div class="slider-labels">
                            <span>🧊 COLD</span>
                            <span>❄️</span>
                            <span>☀️ WARM</span>
                            <span>🔶</span>
                            <span>🌶️ HOT</span>
                        </div>
                    </div>
                    <div class="selected-difficulty" id="selectedDifficulty">ALL LEVELS</div>
                </div>
            </div>
        </div>

        <div class="result-display" id="resultDisplay">
            <div class="position-name" id="positionName">NO FEAR BE BRAVE</div>
            <div class="position-metadata">
                <div class="difficulty-level" id="difficultyLevel"></div>
                <div class="volume-bar" id="volumeBar">
                    <div class="volume-fill"></div>
                    <div class="volume-labels">
                        <span>🧊</span><span>❄️</span><span>☀️</span><span>🔶</span><span>🌶️</span>
                    </div>
                </div>
                <div class="emotion-category" id="emotionCategory"></div>
            </div>
            <div class="position-description" id="positionDescription">Random Adult Education</div>
            <div class="position-instructions" id="positionInstructions" style="display: none;">
                <h3 class="instructions-title">Body Positioning & Setup:</h3>
                <div class="instructions-content" id="instructionsContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
